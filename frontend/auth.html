<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flora | Login</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <main class="auth-container">
        <div class="auth-box">
            <header class="auth-header">
                <div class="logo-mark">F</div>
                <h1>Welcome Back</h1>
                <p>Log in to your Flora account</p>
            </header>

            <form id="auth-form" class="auth-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required minlength="6">
                </div>

                <p id="error" style="color: #B3462F; text-align: center; margin-bottom: 16px;"></p>

                <button type="submit" class="primary-btn" style="width: 100%;">Login</button>
            </form>
        </div>
    </main>

    <script src="js/firebase/firebase-app-compat.js"></script>
    <script src="js/firebase/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        firebase.initializeApp(window.FLORA_FIREBASE_CONFIG);
        const auth = firebase.auth();

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');

            try {
                await auth.signInWithEmailAndPassword(email, password);
                window.location.href = 'dashboard.html';
            } catch (err) {
                errorEl.textContent = err.message;
                console.error(err);
            }
        });
    </script>
</body>
</html>
