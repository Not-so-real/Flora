<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flora | My Notes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/notes.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="flora-animated">

    <header class="notes-nav">
        <a href="index.html" class="notes-nav-logo">Flora</a>
        <div class="notes-nav-center">
            <a href="dashboard.html" class="notes-nav-link notes-dashboard-link">Dashboard</a>
            <a href="notes.html" class="notes-nav-link active">Notes</a>
        </div>
        <div class="notes-nav-right" aria-label="Local student profile">
            <span class="notes-nav-avatar">S</span>
        </div>
    </header>

    <main class="notes-page fade-in">

        <!-- ============== Sidebar ============== -->

        <aside class="notes-sidebar">

            <a href="dashboard.html" class="back-to-dashboard">Back to Dashboard</a>

            <div class="sidebar-header">

                <h2>My Notes</h2>
                <p>Organize everything in one place.</p>

                <button class="primary-btn" id="new-note-btn">
                    + New Note
                </button>

            </div>

            <!-- Folders -->
            <div class="folders-section">
                <div class="folders-header">
                    <h3>My Folders</h3>
                </div>
                <div class="folders-list" id="folders-list"></div>
                <input type="text" id="new-folder-input" class="new-folder-input" placeholder="+ New folder">
            </div>

            <div class="search-box">
                <input type="text" id="note-search" placeholder="Search notes...">
            </div>

            <div class="notes-list" id="notes-list"></div>

        </aside>

        <!-- ============== Editor ============== -->

        <section class="notes-editor slide-up">

            <!-- Note Header -->

            <div class="editor-header">

                <div class="editor-title-block">

                    <h2 id="note-title">
                        📝 No Note Selected
                    </h2>

                    <span id="save-status" class="save-status hidden"></span>

                </div>

            </div>


            <!-- Formatting Toolbar -->

            <div class="editor-toolbar">

                <button class="toolbar-btn" data-command="bold" title="Bold (Ctrl+B)">
                    <strong>B</strong>
                </button>

                <button class="toolbar-btn" data-command="italic" title="Italic (Ctrl+I)">
                    <em>I</em>
                </button>

                <button class="toolbar-btn" data-command="underline" title="Underline (Ctrl+U)">
                    <u>U</u>
                </button>

                <button class="toolbar-btn" data-command="formatBlock" data-value="h2" title="Heading">
                    H1
                </button>

                <button class="toolbar-btn" data-command="formatBlock" data-value="h3" title="Subheading">
                    H2
                </button>

                <button class="toolbar-btn" data-command="insertUnorderedList" title="Bullet List">
                    • List
                </button>

                <button class="toolbar-btn" data-command="insertOrderedList" title="Numbered List">
                    1. List
                </button>

            </div>

            <!-- Note Meta -->
            <div class="note-meta-row">
                <div class="note-folder-select">
                    <span class="meta-prefix">Folder:</span>
                    <select id="note-folder-select"></select>
                </div>
                <div class="note-subject-select">
                    <span class="meta-prefix">Subject:</span>
                    <select id="note-subject-select"></select>
                </div>
                <div class="note-chapter-select">
                    <span class="meta-prefix">Chapter:</span>
                    <select id="note-chapter-select"></select>
                </div>
            </div>

            <!-- Writing Area -->

            <div class="note-editor" id="note-editor" contenteditable="true"
                data-placeholder="Start typing your notes here...">
            </div>


            <!-- AI Tools -->

            <div class="ai-tools">

                <div class="ai-buttons">

                    <button class="tool-btn">
                        ✨ Summarize
                    </button>

                    <button class="tool-btn">
                        🧠 Flashcards
                    </button>

                    <button class="tool-btn">
                        ❓ Quiz
                    </button>

                    <button class="tool-btn">
                        💡 Explain
                    </button>

                </div>

            </div>

        </section>

    </main>
    <script src="js/notes.js"></script>
</body>

</html>
