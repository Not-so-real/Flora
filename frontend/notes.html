<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flora | My Notes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/notes.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="flora-animated">

    <header class="notes-nav">
        <a href="index.html" class="notes-nav-logo">Flora</a>
        <div class="notes-nav-center">
            <a href="dashboard.html" class="notes-nav-link notes-dashboard-link">Dashboard</a>
            <a href="notes.html" class="notes-nav-link active">Notes</a>
        </div>
        <div class="notes-nav-right" aria-label="Local student profile">
            <span class="notes-nav-avatar">S</span>
        </div>
    </header>

    <main class="notes-page fade-in">

        <!-- ============== Sidebar ============== -->

        <aside class="notes-sidebar">

            <a href="dashboard.html" class="back-to-dashboard">Back to Dashboard</a>

            <div class="sidebar-header">

                <h2>My Notes</h2>
                <p>Organize everything in one place.</p>

                <button class="primary-btn" id="new-note-btn">
                    + New Note
                </button>

            </div>

            <!-- Folders -->
            <div class="folders-section">
                <div class="folders-header">
                    <h3>My Folders</h3>
                </div>
                <div class="folders-list" id="folders-list"></div>
                <input type="text" id="new-folder-input" class="new-folder-input" placeholder="+ New folder">
            </div>

            <div class="notes-filter-section">
                <div class="notes-filter-header">
                    <h3>View Notes</h3>
                    <button type="button" id="clear-note-filters" class="clear-note-filters">Clear</button>
                </div>
                <select id="note-subject-filter" aria-label="Filter notes by subject"></select>
                <select id="note-chapter-filter" aria-label="Filter notes by chapter"></select>
                <p class="notes-filter-context" id="notes-filter-context"></p>
            </div>

            <div class="search-box">
                <input type="text" id="note-search" placeholder="Search notes...">
            </div>

            <div class="notes-list" id="notes-list"></div>

        </aside>

        <!-- ============== Editor ============== -->

        <section class="notes-editor slide-up">

            <!-- Note Header -->

            <div class="editor-header">

                <div class="editor-title-block">

                    <h2
                        id="note-title"
                        contenteditable="true"
                        role="textbox"
                        aria-label="Note title"
                        aria-multiline="false"
                        data-placeholder="Untitled Note">
                    </h2>

                    <span id="save-status" class="save-status hidden"></span>

                </div>

            </div>


            <!-- Formatting Toolbar -->

            <div class="editor-toolbar">

                <button class="toolbar-btn" data-command="bold" title="Bold (Ctrl+B)">
                    <strong>B</strong>
                </button>

                <button class="toolbar-btn" data-command="italic" title="Italic (Ctrl+I)">
                    <em>I</em>
                </button>

                <button class="toolbar-btn" data-command="underline" title="Underline (Ctrl+U)">
                    <u>U</u>
                </button>

                <button class="toolbar-btn" data-command="formatBlock" data-value="h2" title="Heading">
                    H1
                </button>

                <button class="toolbar-btn" data-command="formatBlock" data-value="h3" title="Subheading">
                    H2
                </button>

                <button class="toolbar-btn" data-command="insertUnorderedList" title="Bullet List">
                    • List
                </button>

                <button class="toolbar-btn" data-command="insertOrderedList" title="Numbered List">
                    1. List
                </button>

            </div>

            <!-- Note Meta -->
            <div class="note-meta-row">
                <div class="note-folder-select">
                    <span class="meta-prefix">Folder:</span>
                    <select id="note-folder-select"></select>
                </div>
                <div class="note-subject-select">
                    <span class="meta-prefix">Subject:</span>
                    <select id="note-subject-select"></select>
                </div>
                <div class="note-chapter-select">
                    <span class="meta-prefix">Chapter:</span>
                    <select id="note-chapter-select"></select>
                </div>
            </div>

            <!-- Writing Area -->

            <div class="note-editor" id="note-editor" contenteditable="true"
                data-placeholder="Start typing your notes here...">
            </div>


            <!-- AI Tools -->

            <div class="ai-tools">

                <div class="ai-buttons">

                    <button class="tool-btn" id="ai-summarize-btn" type="button">
                        ✨ Summarize
                    </button>

                    <button class="tool-btn" id="ai-flashcards-btn" type="button">
                        🧠 Flashcards
                    </button>

                    <button class="tool-btn" id="ai-quiz-btn" type="button">
                        ❓ Quiz
                    </button>

                    <button class="tool-btn" id="ai-explain-btn" type="button">
                        💡 Explain
                    </button>

                    <button class="tool-btn ai-settings-btn" id="ai-settings-btn" type="button">
                        ⚙️ AI Settings
                    </button>

                </div>

                <div id="ai-output" class="ai-output is-hidden">
                    <div class="ai-output-header">
                        <span id="ai-output-label">AI Response</span>
                        <button type="button" id="ai-output-close" class="ai-output-close">&times;</button>
                    </div>
                    <div id="ai-output-content" class="ai-output-content"></div>
                    <div id="ai-output-actions" class="ai-output-actions is-hidden">
                        <button type="button" class="primary-btn" id="ai-save-result-btn">Save to Flora</button>
                    </div>
                </div>

                <p id="ai-status" class="ai-status"></p>

            </div>

            <!-- AI Settings Dialog -->
            <dialog class="ai-settings-dialog" id="ai-settings-dialog">
                <form method="dialog" id="ai-settings-form">
                    <div class="ai-settings-header">
                        <div>
                            <p class="ai-settings-eyebrow">AI Configuration</p>
                            <h2>AI Settings</h2>
                        </div>
                        <button type="button" class="ai-settings-close-btn" id="ai-settings-close">&times;</button>
                    </div>

                    <label for="ai-api-key">OpenRouter API Key</label>
                    <input type="password" id="ai-api-key" placeholder="Paste your OpenRouter key (sk-or-v1-...)">
                    <p class="ai-key-help">Get a free key from <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a>. Sign in with Google or GitHub. Your key is stored only in your browser.</p>

                    <label for="ai-model-select">AI Model</label>
                    <select id="ai-model-select">
                        <option value="">-- Save key first, then load models --</option>
                    </select>
                    <button type="button" class="secondary-ai-btn" id="ai-load-models-btn" style="width:100%;margin:8px 0 16px;">Load Free Models</button>

                    <div class="ai-settings-actions">
                        <button type="button" class="secondary-ai-btn" id="ai-settings-cancel">Cancel</button>
                        <button type="submit" class="primary-btn">Save Settings</button>
                    </div>
                </form>
            </dialog>

        </section>

    </main>
    <script src="js/ai.js" defer></script>
    <script src="js/notes.js" defer></script>
</body>

</html>
