<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flora | Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/planner.css">
</head>
<body class="flora-animated planner-page-body">
    <main class="planner-page fade-in">
        <header class="planner-header">
            <a href="dashboard.html" class="back-btn" style="margin-bottom: 26px;">Back to Dashboard</a>
            <p class="planner-eyebrow">Study planning</p>
            <h1>Planner</h1>
            <p>Schedule your study tasks by subject, chapter, date, and priority.</p>
        </header>

        <section class="planner-layout">
            <aside class="planner-panel">
                <div class="planner-panel-header">
                    <h2>Tasks</h2>
                    <button type="button" class="primary-btn" id="new-task-btn">+ New Task</button>
                </div>

                <div class="planner-filters">
                    <label for="planner-search">Search</label>
                    <input type="search" id="planner-search" placeholder="Search tasks...">

                    <label for="planner-status-filter">Status</label>
                    <select id="planner-status-filter">
                        <option value="">All statuses</option>
                        <option value="todo">To do</option>
                        <option value="done">Done</option>
                    </select>

                    <label for="planner-subject-filter">Subject</label>
                    <select id="planner-subject-filter"></select>
                </div>

                <div class="planner-task-list" id="planner-task-list"></div>
            </aside>

            <section class="planner-editor-wrap">
                <div class="planner-editor-header">
                    <div>
                        <p class="planner-eyebrow small">Task editor</p>
                        <h2 id="planner-editor-title">Select a task</h2>
                    </div>
                    <span id="planner-save-status" class="planner-save-status hidden"></span>
                </div>

                <form id="planner-form" class="planner-form is-hidden">
                    <input type="hidden" id="planner-task-id">

                    <label for="planner-task-title">Task title</label>
                    <input type="text" id="planner-task-title" maxlength="120" placeholder="e.g. Review chapter 4 notes" required>

                    <div class="planner-meta-grid">
                        <label>
                            <span>Subject</span>
                            <select id="planner-task-subject"></select>
                        </label>
                        <label>
                            <span>Chapter</span>
                            <select id="planner-task-chapter"></select>
                        </label>
                        <label>
                            <span>Due date</span>
                            <input type="date" id="planner-task-due-date">
                        </label>
                        <label>
                            <span>Priority</span>
                            <select id="planner-task-priority">
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                            </select>
                        </label>
                    </div>

                    <label for="planner-task-notes">Notes <small>Optional</small></label>
                    <textarea id="planner-task-notes" rows="4" maxlength="300" placeholder="Any details for this task?"></textarea>

                    <label class="planner-checkbox">
                        <input type="checkbox" id="planner-task-done">
                        <span>Mark as completed</span>
                    </label>

                    <p id="planner-form-error" class="planner-form-error" role="alert"></p>

                    <div class="planner-actions">
                        <button type="button" class="danger-btn" id="delete-task-btn" hidden>Delete Task</button>
                        <button type="submit" class="primary-btn">Save Task</button>
                    </div>
                </form>

                <div class="planner-empty" id="planner-empty">
                    <span>P</span>
                    <h2>No task selected</h2>
                    <p>Select a task from the list or create a new one.</p>
                    <button type="button" class="primary-btn" id="empty-new-task-btn">Create Task</button>
                </div>
            </section>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/firebase-db.js"></script>
    <script src="js/planner.js"></script>
</body>
</html>
